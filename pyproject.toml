[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-lens"
version = "0.1.0"
description = "Visualize attention, Grad-CAM, and patch features for images and video."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "vision-lens contributors" }
]
keywords = [
  "computer-vision",
  "vision-transformer",
  "attention",
  "grad-cam",
  "visualization",
  "video",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "timm>=1.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.urls]
Homepage = "https://github.com/josedelrey/vision-lens"
Documentation = "https://github.com/josedelrey/vision-lens#readme"
Issues = "https://github.com/josedelrey/vision-lens/issues"
Source = "https://github.com/josedelrey/vision-lens"

[project.scripts]
vision-lens = "vision_lens.cli:main"

[project.optional-dependencies]
video = [
  "av>=13.1,<17",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vision_lens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "real_model: downloads and runs a supported pretrained model",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
