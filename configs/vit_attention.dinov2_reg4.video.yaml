input:
  files:
    - videos/2.mp4

model:
  architecture: vit
  backend: timm
  name: hf_hub:timm/vit_small_patch14_reg4_dinov2.lvd142m

preprocessing:
  interpolation: bilinear

analysis:
  method: attention
  layers: [11]

visualization:
  output_size: match
  interpolation: nearest
  overlay_alpha: 1.0
  overlay_alpha_curve: {steepness: 15, midpoint: 0.25}
  cmap_black: {threshold: 20, blend_width: 35, transparent: true}

output:
  directory: outputs/video/dinov2_reg4_attention
  overwrite: replace

video:
  sampling_rate: auto
