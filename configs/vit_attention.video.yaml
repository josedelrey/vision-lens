input:
  files:
    - videos/2.mp4
  folders: []
  patterns:
    - '*.mp4'
  recursive: false
  limit: null

model:
  architecture: vit
  backend: timm
  name: vit_small_patch8_224.dino
  pretrained: true
  options: {}

preprocessing:
  image_size: 224
  resize: stretch
  crop: none
  pad: none
  interpolation: bilinear
  normalize: true
  mean: null
  std: null

analysis:
  method: attention
  layers:
    - 11
  heads: null
  head_fusion: mean

runtime:
  batch_size: 1
  device: auto
  workers: 0
  precision: float32
  seed: null

visualization:
  tile_size: null
  columns: null
  items_per_grid: null
  spacing: null
  padding: null
  labels: null
  background: null
  dpi: null
  output_size: match
  interpolation: anyup_soft_mask
  anyup_query_chunk_size: 4096
  overlay_alpha: 1.0
  overlay_alpha_curve:
    steepness: 15
    midpoint: 0.25
  cmap: viridis
  cmap_black:
    threshold: 20
    blend_width: 35
    transparent: true
  grid_format: png
  normalization: per_map
  normalization_range: null

output:
  directory: outputs/video/dino_vits8_attention
  heatmaps: false
  overlays: true
  grids: true
  raw_arrays: false
  image_format: png
  raw_format: npy
  overwrite: replace

video:
  start_time: 0.0
  end_time: null
  sampling_rate: auto
  frame_limit: null
  pca_fit_frames: 32
  temporal_smoothing: 0.0
  codec: libx264
