input:
  files:
    - videos/2.mp4

model:
  architecture: cnn
  backend: torchvision
  name: resnet50

preprocessing:
  interpolation: bilinear

analysis:
  method: gradcam
  target_layer: layer4

visualization:
  output_size: match
  interpolation: nearest
  overlay_alpha: 1.0
  overlay_alpha_curve: {steepness: 15, midpoint: 0.25}
  cmap_black: {threshold: 20, blend_width: 35, transparent: true}

output:
  directory: outputs/video/resnet50_gradcam
  overwrite: replace

video:
  sampling_rate: auto
