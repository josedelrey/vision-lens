input:
  folders:
    - examples

model:
  architecture: vit
  backend: timm
  name: hf_hub:timm/vit_small_patch14_reg4_dinov2.lvd142m

preprocessing:
  interpolation: bilinear

analysis:
  method: attention
  layers: [2, 5, 8, 11]

visualization:
