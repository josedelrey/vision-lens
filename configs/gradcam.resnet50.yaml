input:
  folders:
    - examples

model:
  architecture: cnn
  backend: torchvision
  name: resnet50

preprocessing:
  interpolation: bilinear

analysis:
  method: gradcam
  target_layer: layer4

visualization:
  output_size: match
  interpolation: nearest
  overlay_alpha: 1.0
  cmap_black: {threshold: 20, blend_width: 35, transparent: true}

output:
  directory: outputs/image/resnet50/gradcam
  transparent_overlays: true
  overwrite: replace
