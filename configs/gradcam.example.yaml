task: gradcam

model:
  architecture: cnn
  backend: torchvision
  name: resnet50
  pretrained: true
  options:
    gradcam_target_layer: layer4

images:
  paths:
    - data/samples/cat.jpg
    - data/samples/coffee.jpg
    - data/samples/rocket.jpg
    - data/samples/motorcycle.jpg
    - data/samples/astronaut.jpg

output:
  directory: outputs/gradcam

runtime:
  device: auto
  image_size: 224

visualization:
  overlay_alpha: 0.35
