task: gradcam

model:
  architecture: cnn
  backend: torchvision
  name: resnet50
  pretrained: true
  options:
    gradcam_target_layer: layer4

images:
  paths:
    - data/examples/1.jpg
    - data/examples/2.jpg
    - data/examples/3.jpg
    - data/examples/4.jpg
    - data/examples/5.jpg
    - data/examples/6.jpg
    - data/examples/7.jpg
    - data/examples/8.jpg

output:
  directory: outputs/gradcam

runtime:
  device: auto
  image_size: 224

visualization:
  overlay_alpha: 0.8
  cmap: viridis
  grid_format: pdf
