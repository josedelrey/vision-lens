input:
  folders:
    - examples

model:
  architecture: vit
  backend: timm
  name: vit_small_patch8_224.dino

preprocessing:
  image_size: 224
  interpolation: bilinear

analysis:
  method: attention
  layers: [2, 5, 8, 11]

visualization:
  output_size: match
  interpolation: bilinear_mask
  overlay_alpha: 1.0
  overlay_alpha_curve: {steepness: 15, midpoint: 0.25}
  cmap_black: {threshold: 20, blend_width: 35, transparent: true}

output:
  directory: outputs/image/dino_vits8_attention
  overwrite: replace
