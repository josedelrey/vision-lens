input:
  files: []
  folders:
    - examples
  patterns:
    - '*.jpg'
    - '*.jpeg'
    - '*.png'
    - '*.webp'
  recursive: false
  limit: null

model:
  architecture: cnn
  backend: torchvision
  name: resnet50
  pretrained: true
  options: {}

preprocessing:
  image_size: 672
  resize: stretch
  crop: none
  pad: none
  interpolation: null
  normalize: true
  mean: null
  std: null

analysis:
  method: gradcam
  target_layer: layer4
  target_class: null

runtime:
  batch_size: 8
  device: auto
  workers: 0
  precision: float32
  seed: null

visualization:
  tile_size: null
  columns: null
  items_per_grid: null
  spacing: null
  padding: null
  labels: null
  background: null
  dpi: null
  overlay_alpha: 0.8
  overlay_alpha_curve: null
  cmap: viridis
  cmap_black:
    threshold: 20
    blend_width: 35
    transparent: true
  grid_format: png
  normalization: per_map
  normalization_range: null

output:
  directory: outputs/gradcam
  heatmaps: true
  overlays: true
  grids: true
  raw_arrays: false
  image_format: png
  raw_format: npy
  overwrite: replace
