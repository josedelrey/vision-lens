preset: dino-vits8-attention

input:
  files: []
  folders: [videos]
  patterns: ["*.mp4"]
  recursive: false
  limit: null

analysis:
  layers: [11]

runtime:
  batch_size: 1

video:
  sampling_rate: auto
  temporal_smoothing: 0.0

output:
  directory: outputs/video/dino_vits8_attention
  heatmaps: false
  overlays: true
  grids: true
  overwrite: replace
