preset: dinov2-pca

input:
  files: []
  folders: [videos]
  patterns: ["*.mp4"]
  recursive: false
  limit: null

runtime:
  batch_size: 1

video:
  sampling_rate: auto
  pca_fit_frames: 32
  temporal_smoothing: 0.0

output:
  directory: outputs/video/dinov2_pca
  heatmaps: true
  overlays: false
  grids: true
  overwrite: replace
