input:
  files: []
  folders:
    - videos
  patterns:
    - '*.mp4'
  recursive: false
  limit: null

model:
  architecture: vit
  backend: timm
  name: hf_hub:timm/vit_base_patch14_dinov2.lvd142m
  pretrained: true
  options: {}

preprocessing:
  image_size: 672
  resize: stretch
  crop: none
  pad: none
  interpolation: null
  normalize: true
  mean: null
  std: null

analysis:
  method: patch_pca
  foreground_threshold: 0.5
  foreground_side: high
  projection: fit
  projection_path: null
  save_projection: null

runtime:
  batch_size: 1
  device: auto
  workers: 0
  precision: float32
  seed: null

visualization:
  tile_size: null
  columns: null
  items_per_grid: null
  spacing: null
  padding: null
  labels: null
  background: null
  dpi: null
  overlay_alpha: 0.45
  cmap: viridis
  grid_format: png
  normalization: per_map
  normalization_range: null

output:
  directory: outputs/video/dinov2_pca
  heatmaps: true
  overlays: false
  grids: true
  raw_arrays: false
  image_format: png
  raw_format: npy
  overwrite: replace

video:
  start_time: 0.0
  end_time: null
  sampling_rate: auto
  frame_limit: null
  output_resolution: null
  pca_fit_frames: 32
  temporal_smoothing: 0.0
  codec: libx264
