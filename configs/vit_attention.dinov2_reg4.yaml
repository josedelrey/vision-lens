input:
  files: []
  folders:
    - examples
  patterns:
    - '*.jpg'
    - '*.jpeg'
    - '*.png'
    - '*.webp'
  recursive: false
  limit: null

model:
  architecture: vit
  backend: timm
  name: hf_hub:timm/vit_small_patch14_reg4_dinov2.lvd142m
  pretrained: true
  options: {}

preprocessing:
  image_size: 672
  resize: stretch
  crop: none
  pad: none
  interpolation: bilinear
  normalize: true
  mean: null
  std: null

analysis:
  method: attention
  layers:
    - 2
    - 5
    - 8
    - 11
  heads: null
  head_fusion: mean

runtime:
  batch_size: 8
  device: auto
  workers: 0
  precision: float32
  seed: null

visualization:
  tile_size: null
  columns: null
  items_per_grid: null
  spacing: null
  padding: null
  labels: null
  background: null
  dpi: null
  match_input_size: true
  interpolation: anyup
  overlay_alpha: 1.0
  overlay_alpha_curve:
    steepness: 15
    midpoint: 0.25
  cmap: viridis
  cmap_black:
    threshold: 20
    blend_width: 35
    transparent: true
  grid_format: png
  normalization: per_map
  normalization_range: null

output:
  directory: outputs/image/dinov2_vits14_reg4_attention
  heatmaps: true
  overlays: true
  grids: true
  raw_arrays: false
  image_format: png
  raw_format: npy
  overwrite: replace
