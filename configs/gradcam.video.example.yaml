preset: resnet50-gradcam

input:
  files: []
  folders: [videos]
  patterns: ["*.mp4"]
  recursive: false
  limit: null

runtime:
  batch_size: 1

video:
  sampling_rate: auto
  temporal_smoothing: 0.0

output:
  directory: outputs/video/resnet50_gradcam
  heatmaps: false
  overlays: true
  grids: true
  overwrite: replace
