preset: dino-vits8-attention

input:
  files:
    - ../data/examples/1.jpg
    - ../data/examples/2.jpg
    - ../data/examples/3.jpg
    - ../data/examples/4.jpg
    - ../data/examples/5.jpg
    - ../data/examples/6.jpg
    - ../data/examples/7.jpg
    - ../data/examples/8.jpg
  folders: []
  patterns: ["*.jpg", "*.jpeg", "*.png", "*.webp"]
  recursive: false
  limit: null

model:
  architecture: vit
  backend: timm
  name: vit_small_patch8_224.dino
  pretrained: true
  options: {}

preprocessing:
  image_size: 224
  resize: stretch
  crop: none
  pad: none
  interpolation: null
  normalize: true
  mean: null
  std: null

analysis:
  method: attention
  layers: [2, 5, 8, 11]
  heads: null
  head_fusion: mean

runtime:
  batch_size: null
  device: auto
  workers: 0
  precision: float32
  seed: null

visualization:
  tile_size: null
  columns: null
  items_per_grid: null
  spacing: null
  padding: null
  labels: null
  background: null
  dpi: null
  overlay_alpha: 0.8
  cmap: viridis
  grid_format: pdf
  normalization: per_map
  normalization_range: null

output:
  directory: ../outputs/dino_vits8_attention
  heatmaps: true
  overlays: true
  grids: true
  raw_arrays: false
  image_format: png
  raw_format: npy
  overwrite: replace
