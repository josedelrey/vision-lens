task: vit_attention

model:
  architecture: vit
  backend: timm
  name: vit_small_patch8_224.dino
  pretrained: true
  options: {}

images:
  paths:
    - data/samples/cat.jpg
    - data/samples/coffee.jpg
    - data/samples/rocket.jpg
    - data/samples/motorcycle.jpg
    - data/samples/astronaut.jpg
    - data/samples/kodim19.png

output:
  directory: outputs/dino_vits8_attention

attention:
  layers: [2, 5, 8, 11]
  heads: null
  head_fusion: max
  rollout_discard_ratio: 0.9

runtime:
  device: auto
  image_size: 224

visualization:
  overlay_alpha: 0.8
  cmap: viridis
  grid_format: pdf
