preset: dinov2-pca

input:
  paths:
    - ../data/examples/5.jpg
    - ../data/examples/6.jpg

model:
  architecture: vit
  backend: timm
  name: hf_hub:timm/vit_base_patch14_dinov2.lvd142m
  pretrained: true
  options: {}

preprocessing:
  image_size: 672

analysis:
  method: patch_pca
  foreground_threshold: 0.5
  foreground_side: low

runtime:
  device: auto

visualization:
  overlay_alpha: 0.45
  cmap: viridis
  grid_format: png

output:
  directory: ../outputs/dinov2_patch_pca
