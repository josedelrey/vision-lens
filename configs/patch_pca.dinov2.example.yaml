preset: dinov2-pca

input:
  files:
    - ../data/examples/5.jpg
    - ../data/examples/6.jpg
  folders: []
  patterns: ["*.jpg", "*.jpeg", "*.png", "*.webp"]
  recursive: false
  limit: null

model:
  architecture: vit
  backend: timm
  name: hf_hub:timm/vit_base_patch14_dinov2.lvd142m
  pretrained: true
  options: {}

preprocessing:
  image_size: 672
  resize: stretch
  crop: none
  pad: none
  interpolation: null
  normalize: true
  mean: null
  std: null

analysis:
  method: patch_pca
  foreground_threshold: 0.5
  foreground_side: low
  projection: fit
  projection_path: null
  save_projection: null

runtime:
  batch_size: 8
  device: auto
  workers: 0
  precision: float32
  seed: null

visualization:
  tile_size: null
  columns: null
  items_per_grid: null
  spacing: null
  padding: null
  labels: null
  background: null
  dpi: null
  overlay_alpha: 0.45
  cmap: viridis
  grid_format: png
  normalization: per_map
  normalization_range: null

output:
  directory: ../outputs/dinov2_patch_pca
  heatmaps: true
  overlays: false
  grids: true
  raw_arrays: false
  image_format: png
  raw_format: npy
  overwrite: replace
