input:
  folders:
    - examples

model:
  architecture: vit
  backend: timm
  name: hf_hub:timm/vit_base_patch14_reg4_dinov2.lvd142m

preprocessing:
  interpolation: bilinear

analysis:
  method: rollout
  layers: [2, 5, 8, 11]

runtime:
  batch_size: 1

visualization:
  rollout_grid: rollout
  output_size: match
  interpolation: nearest
  overlay_alpha: 1.0
  cmap_black: {threshold: 20, blend_width: 35, transparent: true}

output:
  directory: outputs/image/dinov2_vitb14_reg4/rollout
  transparent_overlays: true
