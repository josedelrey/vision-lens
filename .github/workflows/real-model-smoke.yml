name: Real-model smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/test_real_models.py -m real_model
        env:
          VISION_LENS_RUN_REAL_MODELS: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
