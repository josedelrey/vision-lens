name: Real-model smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_real_models.py -m real_model
        env:
          VISION_LENS_RUN_REAL_MODELS: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
