name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,video]"
      - run: ruff check vision_lens tests scripts
      - run: ruff format --check vision_lens tests scripts
      - run: pytest -m "not real_model"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv clean-install
      - run: clean-install/bin/python -m pip install dist/*.whl
      - run: clean-install/bin/vision-lens --list-presets
      - run: clean-install/bin/vision-lens validate --config configs/vit_attention.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
