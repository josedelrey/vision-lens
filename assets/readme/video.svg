<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Video frame sequence figure placeholder</title>
  <desc id="description">Three empty frame panels reserved for sampled video results at distinct timestamps.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#1a2030"/>
      <stop offset="1" stop-color="#2c2940"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#827b9b" stroke-opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#background)"/>
  <text x="44" y="58" fill="#f0f4f7" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="1">Across time</text>
  <text x="1156" y="56" fill="#aaa3bc" text-anchor="end" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">FIGURE 03 / VIDEO</text>
  <path d="M44 78H1156" stroke="#655c77"/>
  <g fill="#1d2434" stroke="#716b86">
    <rect x="44" y="112" width="356" height="248" rx="8"/>
    <rect x="422" y="112" width="356" height="248" rx="8"/>
    <rect x="800" y="112" width="356" height="248" rx="8"/>
  </g>
  <g fill="url(#grid)" stroke="#a79ab5" stroke-dasharray="7 7">
    <rect x="58" y="126" width="328" height="220" rx="4"/>
    <rect x="436" y="126" width="328" height="220" rx="4"/>
    <rect x="814" y="126" width="328" height="220" rx="4"/>
  </g>
  <g fill="#cbbfd2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="1.5">
    <text x="222" y="245">SAMPLED FRAME</text>
    <text x="600" y="245">SAMPLED FRAME</text>
    <text x="978" y="245">SAMPLED FRAME</text>
  </g>
  <path d="M44 394H1156" stroke="#655c77"/>
  <circle cx="222" cy="394" r="5" fill="#d5a4b4"/>
  <circle cx="600" cy="394" r="5" fill="#d5a4b4"/>
  <circle cx="978" cy="394" r="5" fill="#d5a4b4"/>
  <g fill="#d8cddc" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="1">
    <text x="222" y="418">t₁</text>
    <text x="600" y="418">t₂</text>
    <text x="978" y="418">t₃</text>
  </g>
</svg>
