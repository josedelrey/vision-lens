<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Layer progression figure placeholder</title>
  <desc id="description">A four-column empty grid reserved for transformer layer results.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#182130"/>
      <stop offset="1" stop-color="#253044"/>
    </linearGradient>
    <pattern id="lines" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24L24 0" stroke="#526276" stroke-opacity=".25"/>
    </pattern>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#background)"/>
  <text x="44" y="58" fill="#f0f4f7" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="1">Across layers</text>
  <text x="1156" y="56" fill="#94a9ba" text-anchor="end" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">FIGURE 02 / PROGRESSION</text>
  <path d="M44 78H1156" stroke="#536276"/>
  <g fill="#172333" stroke="#64768a">
    <rect x="44" y="112" width="263" height="263" rx="8"/>
    <rect x="327" y="112" width="263" height="263" rx="8"/>
    <rect x="610" y="112" width="263" height="263" rx="8"/>
    <rect x="893" y="112" width="263" height="263" rx="8"/>
  </g>
  <g fill="url(#lines)" stroke="#8199ad" stroke-dasharray="7 7">
    <rect x="59" y="127" width="233" height="233" rx="4"/>
    <rect x="342" y="127" width="233" height="233" rx="4"/>
    <rect x="625" y="127" width="233" height="233" rx="4"/>
    <rect x="908" y="127" width="233" height="233" rx="4"/>
  </g>
  <g fill="#c4d4df" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.5">
    <text x="175" y="250">RESULT IMAGE</text>
    <text x="458" y="250">RESULT IMAGE</text>
    <text x="741" y="250">RESULT IMAGE</text>
    <text x="1024" y="250">RESULT IMAGE</text>
  </g>
  <g fill="#9fc2d4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">
    <text x="175" y="408">LAYER 02</text>
    <text x="458" y="408">LAYER 05</text>
    <text x="741" y="408">LAYER 08</text>
    <text x="1024" y="408">LAYER 11</text>
  </g>
</svg>
