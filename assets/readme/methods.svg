  <text x="1156" y="56" fill="#94a9ba" text-anchor="end" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">FIGURE 01 / METHODS</text>
  <path d="M44 77H1156" stroke="#46576a"/>
  <g fill="#172435" stroke="#52667a">
