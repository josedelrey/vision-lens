<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Method comparison figure placeholder</title>
  <desc id="description">Four empty panels reserved for attention, rollout, Grad-CAM, and patch PCA results.</desc>
  <defs>
